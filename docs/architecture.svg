<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="720" viewBox="0 0 1240 720" font-family="'Avenir Next','Helvetica Neue',Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#5B7FB8"/>
    </marker>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A1020"/>
      <stop offset="1" stop-color="#0C1428"/>
    </linearGradient>
  </defs>

  <rect width="1240" height="720" fill="url(#ground)" rx="14"/>

  <!-- title -->
  <text x="48" y="52" fill="#FFFFFF" font-size="24" font-weight="600">sovereign-rag · the paired evaluation harness</text>
  <text x="48" y="76" fill="#B4C2D8" font-size="13.5">every arrow is checkpointed jsonl; every box recomputes from committed artifacts · fully self-hosted, no API key</text>

  <!-- ===== column 1: corpora ===== -->
  <g>
    <text x="48" y="122" fill="#8FA3C4" font-size="12" font-weight="600" letter-spacing="1.5">CORPORA · 8</text>
    <rect x="48" y="134" width="212" height="192" rx="10" fill="#111C36" stroke="#24365C"/>
    <text x="66" y="162" fill="#E6EDF7" font-size="13.5">MultiHop-RAG news (en)</text>
    <text x="66" y="184" fill="#E6EDF7" font-size="13.5">HotpotQA wiki (en)</text>
    <text x="66" y="206" fill="#E6EDF7" font-size="13.5">SQuAD single-hop (en)</text>
    <text x="66" y="228" fill="#E6EDF7" font-size="13.5">iapp wiki QA (th)</text>
    <text x="66" y="250" fill="#E6EDF7" font-size="13.5">JSQuAD (ja) · CMRC (zh)</text>
    <text x="66" y="272" fill="#E6EDF7" font-size="13.5">SQAC (es) · ViQuAD (vi)</text>
    <text x="66" y="300" fill="#8FA3C4" font-size="11.5">hash-manifested · deterministic</text>
  </g>

  <!-- chunker -->
  <rect x="48" y="356" width="212" height="74" rx="10" fill="#111C36" stroke="#24365C"/>
  <text x="66" y="384" fill="#E6EDF7" font-size="13.5" font-weight="600">sentence-pack chunker</text>
  <text x="66" y="404" fill="#B4C2D8" font-size="12">real BPE counts · pySBD · canary</text>
  <text x="66" y="421" fill="#B4C2D8" font-size="12">zero overlap · article-scoped</text>

  <path d="M154 326 V356" stroke="#5B7FB8" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- ===== column 2: retrieval ===== -->
  <g>
    <text x="320" y="122" fill="#8FA3C4" font-size="12" font-weight="600" letter-spacing="1.5">RETRIEVAL ARMS</text>
    <rect x="320" y="134" width="224" height="86" rx="10" fill="#111C36" stroke="#24365C"/>
    <text x="338" y="162" fill="#E6EDF7" font-size="13.5" font-weight="600">BM25 · language-segmented</text>
    <text x="338" y="182" fill="#B4C2D8" font-size="12">newmm / janome / jieba:</text>
    <text x="338" y="199" fill="#B4C2D8" font-size="12">whitespace BM25 deletes th/ja/zh</text>

    <rect x="320" y="234" width="224" height="66" rx="10" fill="#111C36" stroke="#24365C"/>
    <text x="338" y="262" fill="#E6EDF7" font-size="13.5" font-weight="600">dense · qwen3-embedding 0.6b</text>
    <text x="338" y="282" fill="#B4C2D8" font-size="12">local, multilingual, cached .npy</text>

    <rect x="320" y="314" width="224" height="66" rx="10" fill="#111C36" stroke="#24365C"/>
    <text x="338" y="342" fill="#E6EDF7" font-size="13.5" font-weight="600">graph · entity-match GraphRAG</text>
    <text x="338" y="362" fill="#B4C2D8" font-size="12">8B-extracted, community mode</text>

    <text x="320" y="412" fill="#8FA3C4" font-size="11.5">strict@k (every gold doc) beside hits@k:</text>
    <text x="320" y="429" fill="#8FA3C4" font-size="11.5">the saturated metric vs the one that discriminates</text>
  </g>

  <path d="M260 393 H320 M260 393 V177 H320 M260 393 V267 H320 M260 393 V347 H320" stroke="#5B7FB8" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>

  <!-- ===== column 3: generation ===== -->
  <g>
    <text x="604" y="122" fill="#8FA3C4" font-size="12" font-weight="600" letter-spacing="1.5">GENERATION · PAIRED ARMS</text>
    <rect x="604" y="134" width="248" height="118" rx="10" fill="#111C36" stroke="#24365C"/>
    <text x="622" y="162" fill="#E6EDF7" font-size="13.5" font-weight="600">local generators</text>
    <text x="622" y="184" fill="#E6EDF7" font-size="13">qwen3:8b · qwen3.6:27b</text>
    <text x="622" y="204" fill="#E6EDF7" font-size="13">Muse Glimmer 30B (llama.cpp)</text>
    <text x="622" y="228" fill="#B4C2D8" font-size="12">temperature 0 · byte-identical prompts</text>

    <rect x="604" y="266" width="248" height="96" rx="10" fill="#111C36" stroke="#24365C"/>
    <text x="622" y="294" fill="#E6EDF7" font-size="13.5" font-weight="600">arms per model, per corpus</text>
    <text x="622" y="316" fill="#E6EDF7" font-size="13">closed-book  vs  RAG@k</text>
    <text x="622" y="336" fill="#B4C2D8" font-size="12">+ ablations: no-escape-hatch,</text>
    <text x="622" y="353" fill="#B4C2D8" font-size="12">recommended-sampling, reasoning-low</text>
  </g>

  <path d="M544 177 H604 M544 267 H576 V193 H604 M544 347 H576 V300 H604" stroke="#5B7FB8" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
  <path d="M728 252 V266" stroke="#5B7FB8" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- ===== column 4: scoring + stats ===== -->
  <g>
    <text x="912" y="122" fill="#8FA3C4" font-size="12" font-weight="600" letter-spacing="1.5">SCORING &amp; VERDICTS</text>
    <rect x="912" y="134" width="280" height="88" rx="10" fill="#111C36" stroke="#24365C"/>
    <text x="930" y="162" fill="#E6EDF7" font-size="13.5" font-weight="600">normalized containment</text>
    <text x="930" y="184" fill="#E6EDF7" font-size="13">abstention as a first-class number</text>
    <text x="930" y="204" fill="#B4C2D8" font-size="12">language-neutral norm · caveats documented</text>

    <rect x="912" y="236" width="280" height="102" rx="10" fill="#15213D" stroke="#D4A843" stroke-width="1.4"/>
    <text x="930" y="264" fill="#D4A843" font-size="13.5" font-weight="600">paired statistics</text>
    <text x="930" y="286" fill="#E6EDF7" font-size="13">exact McNemar on discordant pairs</text>
    <text x="930" y="306" fill="#E6EDF7" font-size="13">bootstrap CIs · Wilson intervals</text>
    <text x="930" y="326" fill="#B4C2D8" font-size="12">full-precision p · Holm where families exist</text>
  </g>

  <path d="M852 300 H882 V178 H912 M852 300 H882 V287 H912" stroke="#5B7FB8" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
  <path d="M1052 222 V236" stroke="#5B7FB8" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- ===== controls strip ===== -->
  <g>
    <rect x="48" y="470" width="1144" height="104" rx="10" fill="#0E1730" stroke="#D4A843" stroke-width="1.2" stroke-dasharray="5 4"/>
    <text x="66" y="498" fill="#D4A843" font-size="12.5" font-weight="600" letter-spacing="1.2">CONTROLS: THE ARMS THAT CAUGHT EVERY HEADLINE</text>
    <text x="66" y="524" fill="#E6EDF7" font-size="13">closed-book floor (answerability/contamination) · constant-answer baseline (the coin) · shuffled-credit control (fake learning)</text>
    <text x="66" y="546" fill="#E6EDF7" font-size="13">calibration cross: abstention × was-the-gold-retrieved · escape-hatch ablation (one sentence, forty points) · cross-corpus + cross-language replication</text>
  </g>
  <path d="M620 430 V470" stroke="#D4A843" stroke-width="1.4" marker-end="url(#arr)" opacity="0.7"/>

  <!-- ===== artifacts footer ===== -->
  <g>
    <rect x="48" y="602" width="1144" height="72" rx="10" fill="#111C36" stroke="#24365C"/>
    <text x="66" y="630" fill="#E6EDF7" font-size="13.5" font-weight="600">committed artifacts: the repo is the evidence</text>
    <text x="66" y="652" fill="#B4C2D8" font-size="12.5">checkpointed per-question rows (reports/*.jsonl) · narrative reports (reports/*.md) · manifests with content hashes · ~7,000 model generations, all resumable, all local</text>
  </g>
  <path d="M620 574 V602" stroke="#5B7FB8" stroke-width="1.6" marker-end="url(#arr)"/>
</svg>
